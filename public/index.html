<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta
      name="description"
      content="Sistema de gestión de seguros de responsabilidad civil vehicular"
    />
    <title>Sistema RCV — Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/styles.css?v=2.4.4" />
    <script src="/js/theme.js?v=2.4.4"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>"
    />
  </head>
  <body>
    <button class="theme-toggle-floating" id="authThemeToggle" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema (Claro / Oscuro)">
      <span class="theme-icon">☀️</span>
    </button>
    <div class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-logo">
            <div class="logo-icon" id="loginLogoIcon">🛡️</div>
            <div class="app-version-badge">Versión 2.4</div>
            <h1>Sistema RCV</h1>
            <p>Gestión de Seguros de Responsabilidad Civil</p>
          </div>

          <div id="authMessage"></div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="loginUser">Usuario</label>
              <input type="text" id="loginUser" class="form-control" placeholder="Ingrese su usuario" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="loginPass">Contraseña</label>
              <input type="password" id="loginPass" class="form-control" placeholder="Ingrese su contraseña" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
              Iniciar Sesión
            </button>
            
            <div style="margin-top: 1rem; text-align: center;">
              <button type="button" class="btn btn-secondary btn-block" onclick="alert('Para problemas de acceso o recuperación de clave, comuníquese con el administrador del sistema.')" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);">
                ¿Problemas para ingresar?
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const logoPath = 'img/logo.png';
      const loginIcon = document.getElementById('loginLogoIcon');
      if (loginIcon) {
        const img = new Image();
        img.onload = function() {
          loginIcon.innerHTML = `<img src="${logoPath}" alt="Logo" style="height:50px;width:auto;object-fit:contain">`;
        };
        img.src = logoPath;
      }
    </script>
    <script src="/js/app.js?v=2.4.4"></script>
  </body>
</html>
