<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema de gestión de seguros de responsabilidad civil vehicular"
    />
    <title>Sistema RCV — Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>"
    />
  </head>
  <body>
    <button class="theme-toggle-floating" id="authThemeToggle" onclick="toggleTheme()" aria-label="Cambiar tema" title="Cambiar tema (Claro / Oscuro)">
      <span class="theme-icon">☀️</span>
    </button>
    <div class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <div class="auth-logo">
            <div class="logo-icon" id="loginLogoIcon">🛡️</div>
            <h1>Sistema RCV</h1>
            <p>Gestión de Seguros de Responsabilidad Civil</p>
          </div>

          <div id="authMessage"></div>

          <div class="demo-credentials-box">
            <div class="demo-credentials-title">🔑 Credenciales Provisionales (Acceso Rápido)</div>
            <div class="demo-credential-pills">
              <button type="button" class="demo-pill active" onclick="fillCredentials('admin', 'admin123', event)">
                <span class="pill-role">🛡️ Administrador</span>
                <span class="pill-creds">admin / admin123</span>
              </button>
              <button type="button" class="demo-pill" onclick="fillCredentials('superadmin', 'AdminEmergencia123*', event)">
                <span class="pill-role">⚡ Superadmin</span>
                <span class="pill-creds">superadmin / AdminEmergencia123*</span>
              </button>
            </div>
            <small class="demo-hint">💡 Haz clic en una credencial para autocompletar el formulario.</small>
          </div>

          <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="loginUser">Usuario</label>
              <input type="text" id="loginUser" class="form-control" value="admin" placeholder="Ingrese su usuario" required />
            </div>
            <div class="form-group">
              <label for="loginPass">Contraseña</label>
              <input type="password" id="loginPass" class="form-control" value="admin123" placeholder="Ingrese su contraseña" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
              Iniciar Sesión
            </button>
            
            <div style="margin-top: 1rem; text-align: center;">
              <button type="button" class="btn btn-secondary btn-block" onclick="alert('Para problemas de acceso o recuperación de clave, comuníquese con el administrador del sistema.')" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);">
                ¿Problemas para ingresar?
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      function fillCredentials(user, pass, evt) {
        document.getElementById('loginUser').value = user;
        document.getElementById('loginPass').value = pass;
        document.querySelectorAll('.demo-pill').forEach(function(p) { p.classList.remove('active'); });
        if (evt && evt.currentTarget) {
          evt.currentTarget.classList.add('active');
        }
      }

      const logoPath = 'img/logo.png';
      const loginIcon = document.getElementById('loginLogoIcon');
      if (loginIcon) {
        const img = new Image();
        img.onload = function() {
          loginIcon.innerHTML = `<img src="${logoPath}" alt="Logo" style="height:50px;width:auto;object-fit:contain">`;
        };
        img.src = logoPath;
      }
    </script>
    <script src="/js/app.js"></script>
  </body>
</html>
